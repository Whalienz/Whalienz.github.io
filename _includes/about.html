<!-- About Section -->
<section id="about" class="about">
    <div class="container">
        <h2 class="section-title">About Me</h2>
        <div class="about-content">
            <div class="about-text">
                <p class="about-description">
                    {{ site.about.description_1 }}
                </p>
                <p class="about-description">
                    {{ site.about.description_2 }}
                </p>
                <div class="about-stats">
                    <div class="stat-item">
                        <i class="fas fa-code"></i>
                        <h3>Projects</h3>
                        <p>{{ site.about.stats.projects }}</p>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-coffee"></i>
                        <h3>Coffee Cups</h3>
                        <p>{{ site.about.stats.coffee_cups }}</p>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-lightbulb"></i>
                        <h3>Ideas</h3>
                        <p>{{ site.about.stats.ideas }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
