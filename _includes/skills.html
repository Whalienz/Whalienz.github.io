<!-- Skills Section -->
<section id="skills" class="skills">
    <div class="container">
        <h2 class="section-title">Skills & Technologies</h2>
        <div class="skills-grid">
            {% for skill in site.data.skills %}
            <div class="skill-card">
                {% if skill.icon_type == 'fontawesome' %}
                <i class="{{ skill.icon }}"></i>
                {% elsif skill.icon_type == 'image' %}
                <img src="{{ skill.icon | relative_url }}" alt="{{ skill.name }}" class="skill-icon">
                {% endif %}
                <h3>{{ skill.name }}</h3>
                <div class="skill-bar">
                    <div class="skill-progress" style="width: {{ skill.level }}%"></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
